<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540" role="img" aria-labelledby="title desc">
<title id="title">Keyblade Transmog</title><desc id="desc">Change your look. Keep your equipped weapon's power. Q cycles appearances and hit sounds; Shift and Q restore.</desc>
