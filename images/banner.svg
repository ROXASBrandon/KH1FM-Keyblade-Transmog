<linearGradient id="blade"><stop stop-color="#9be7ff"/><stop offset="1" stop-color="#f1f9ff"/></linearGradient>
<radialGradient id="light"><stop stop-color="#6ca8ef" stop-opacity=".3"/><stop offset="1" stop-color="#6ca8ef" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#b9d8ff" stroke-opacity=".045"/></pattern>
</defs>
<rect width="1600" height="540" rx="24" fill="url(#bg)"/><rect width="1600" height="540" fill="url(#grid)"/>
