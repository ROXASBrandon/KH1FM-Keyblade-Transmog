<text x="66" y="323" fill="#f4f8ff" font-family="Arial,sans-serif" font-size="78" font-weight="700">TRANSMOG</text>
<text x="70" y="373" fill="#b7c9e3" font-family="Arial,sans-serif" font-size="27">Change your look. Keep your power.</text>
<rect x="70" y="421" width="52" height="46" rx="9" fill="#243951" stroke="#7fa5cb"/><text x="96" y="453" text-anchor="middle" fill="#eff8ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">Q</text>
<text x="141" y="452" fill="#d7e5f6" font-family="Arial,sans-serif" font-size="22">18 looks + hit sounds</text><text x="410" y="452" fill="#a7bcda" font-family="Arial,sans-serif" font-size="22">Shift + Q restores</text>
