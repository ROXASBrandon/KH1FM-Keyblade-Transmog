title: Keyblade Transmog (Q)
originalAuthor: ROXASBrandon
description: >
  Q instantly cycles 18 cosmetic Keyblade models, new trails and matching hit sounds,
  retaining equipped weapon stats and abilities. Shift+Q restores the equipped look.
  Retains selection through area changes and death/retry.
  Steam release and LuaBackend required. Compatible with Keyblade of Heart.
